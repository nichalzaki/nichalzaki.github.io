about: |
  I've spent more than a decade on the space between letters, the rhythm of a paragraph, and the quiet structure that lets a reader forget they're reading a book.

  I also run Penerbit Alinea, a small academic and Islamic press in Semarang, so I know what printers, platforms and publishers expect from a file. Every project has the same goal: a book that sits comfortably next to any traditionally published title.
tools: [Adobe InDesign, Illustrator, Photoshop, Affinity Publisher, Acrobat Pro, Sigil, EPUBCheck]

faq:
  - q: What file formats do you accept?
    a: Word (.docx), Google Docs, RTF and plain text. For image-heavy books, please send images as high-resolution JPG or PNG (300 dpi minimum).
  - q: How long does a project take?
    a: Basic projects take 3–5 business days. Standard and Premium take 7–14 days depending on page count. Rush delivery (24–72h) is available for an extra fee.
  - q: Do you guarantee KDP / IngramSpark approval?
    a: Every file is preflighted to platform specs. If a file is rejected because of a layout issue on my side, I fix it at no charge.
  - q: Can I see a sample before I commit?
    a: Yes. I can lay out a 2–5 page sample from your manuscript so you can see the look and feel first.
  - q: What if I need more revisions than included?
    a: One revision round covers as many changes as you need. Extra rounds beyond the limit are billed at a flat rate.
  - q: Do you sign an NDA?
    a: Yes. Your manuscript stays confidential and is never shared with third parties.

