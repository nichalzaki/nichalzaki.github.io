process:
  - title: Discovery
    text: We go through genre, readers, trim size, platform and visual references before anything is laid out.
  - title: Design & layout
    text: A custom type system and grid, then every page set by hand, with widows, orphans, spacing and image flow handled.
  - title: Review & revisions
    text: You get a proof PDF and we refine it together. Revisions are included, not charged per change.
  - title: Export & QA
    text: Final files are preflighted, validated and exported to your platform's exact spec, ready to upload.

